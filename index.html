<style>
/* Layout: phone-first app shell — top bar, one scrolling screen per tab with pull-to-refresh, floating tab bar with a centre add button; everything else in bottom sheets */
:root {
  /* colour */
  --bg: #F8F6F1;
  --card: #FFFFFF;
  --brand: #11634F;
  --brand-soft: #DCEDE5;
  --ink: #182824;
  --line: #E8E9E4;
  --muted: #66716C;
  --faint: #EFEEE8;
  --danger: #C2412D; --danger-soft: #FAE4DF;
  --warn: #A86A12;   --warn-soft: #FBF0DA;
  --info: #2F5E9E;   --info-soft: #E3ECF8;
  --on-brand: #FFFFFF;
  --scrim: rgba(24, 40, 36, .38);
  --skel: #ECEAE3; --skel-hi: #F6F5F0;
  --c0: #11634F; --c1: #D0773A; --c2: #3F78B5; --c3: #8A5BB0; --c4: #B58D2C;
  --c5: #C2412D; --c6: #3E8F8F; --c7: #B5578A; --c8: #7A8681; --c9: #5D7F2E;
  /* type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --fs-xs: .72rem; --fs-sm: .82rem; --fs-md: .94rem; --fs-lg: 1.1rem; --fs-xl: 1.5rem; --fs-2xl: 2.1rem; --fs-hero: 2.6rem;
  /* shape & depth */
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
  --sh-1: 0 1px 2px rgba(24, 40, 36, .05), 0 2px 10px rgba(24, 40, 36, .04);
  --sh-2: 0 6px 24px rgba(24, 40, 36, .12), 0 1px 3px rgba(24, 40, 36, .08);
  /* motion */
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.32, .64, 1);
  --d-btn: 140ms; --d-tab: 200ms; --d-card: 280ms; --d-sheet: 360ms; --d-chart: 620ms;
  --tabbar-h: 64px;
  --cal1: #EAF4EF; --cal2: #D3E8DD; --cal3: #B5D7C6; --cal4: #8EC2A9; --cal-ink: #0E4E3E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --card: #18201D; --brand: #5FBF9B; --brand-soft: #1B3129; --ink: #E7EEEA; --line: #26302C; --muted: #93A29A; --faint: #1E2724;
    --danger: #EF7E68; --danger-soft: #3A221D; --warn: #E2B35A; --warn-soft: #3A2E17; --info: #8DB4EA; --info-soft: #1C2A3D; --on-brand: #0F1513;
    --scrim: rgba(0, 0, 0, .55); --skel: #212A27; --skel-hi: #2A3430;
    --c0: #5FBF9B; --c1: #EB9A5E; --c2: #78A9E0; --c3: #B993DC; --c4: #DCBE62; --c5: #EF7E68; --c6: #78C6C6; --c7: #E08BB7; --c8: #A3B0A9; --c9: #A9CC72;
    --sh-1: 0 1px 2px rgba(0, 0, 0, .3); --sh-2: 0 8px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cal1: #1A2E27; --cal2: #1F3B31; --cal3: #26503F; --cal4: #2F6650; --cal-ink: #CDEBDD; } }
:root[data-theme="dark"] { --cal1: #1A2E27; --cal2: #1F3B31; --cal3: #26503F; --cal4: #2F6650; --cal-ink: #CDEBDD; }
:root[data-theme="dark"] {
  --bg: #0F1513; --card: #18201D; --brand: #5FBF9B; --brand-soft: #1B3129; --ink: #E7EEEA; --line: #26302C; --muted: #93A29A; --faint: #1E2724;
  --danger: #EF7E68; --danger-soft: #3A221D; --warn: #E2B35A; --warn-soft: #3A2E17; --info: #8DB4EA; --info-soft: #1C2A3D; --on-brand: #0F1513;
  --scrim: rgba(0, 0, 0, .55); --skel: #212A27; --skel-hi: #2A3430;
  --c0: #5FBF9B; --c1: #EB9A5E; --c2: #78A9E0; --c3: #B993DC; --c4: #DCBE62; --c5: #EF7E68; --c6: #78C6C6; --c7: #E08BB7; --c8: #A3B0A9; --c9: #A9CC72;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3); --sh-2: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* The page itself never scrolls or bounces (iOS Safari would drag the whole app around);
   only the inner lists scroll. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* 16px keeps iOS Safari from zooming on focus */
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }

/* press feedback shared by every tappable thing */
.press { transition: transform var(--d-btn) var(--ease), background-color var(--d-btn) var(--ease), box-shadow var(--d-btn) var(--ease), opacity var(--d-btn); }
.press:active { transform: scale(.96); }
.card.press:active { transform: scale(.985); }

/* ---------- shell ---------- */
.app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; position: relative; }
.demo-banner { background: var(--warn-soft); color: var(--warn); font-size: var(--fs-xs); text-align: center; padding: 3px 8px; font-weight: 600; flex: none; }
.topbar { flex: none; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 6px; padding-block: max(8px, env(safe-area-inset-top, 0px)) 6px; background: var(--bg); z-index: 5; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: none; background: none; display: grid; place-items: center; color: var(--ink); }
.iconbtn svg { width: 22px; height: 22px; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; border: none; background: none; padding: 4px 6px; border-radius: 12px; text-align: left; }
.who .av { width: 30px; height: 30px; font-size: .8rem; }
.who > div { min-width: 0; }
.who strong { font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.who small { display: block; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.monthnav { display: flex; align-items: center; gap: 2px; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: var(--sh-1); }
.monthnav button { width: 30px; height: 30px; border-radius: 50%; border: none; background: none; font-size: 1.05rem; color: var(--muted); }
.monthnav span { font-weight: 700; font-size: var(--fs-sm); min-width: 5.6em; text-align: center; }
.screens { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-block: 6px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.screen.enter { animation: screen-in var(--d-card) var(--ease); }
@keyframes screen-in { from { opacity: 0; transform: translateY(8px); } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 2px -4px; }
.section-title h2 { font-size: var(--fs-md); margin: 0; font-weight: 700; }
.section-title button { border: none; background: none; color: var(--brand); font-weight: 600; font-size: var(--fs-sm); padding: 4px; }

/* ---------- floating tab bar ---------- */
.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10; touch-action: none; max-width: 616px; margin-inline: auto;
  height: var(--tabbar-h); display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center;
  background: var(--card); background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--sh-2);
}
.tab { position: relative; z-index: 1; height: 100%; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: .66rem; font-weight: 600; }
.tab svg { width: 24px; height: 24px; transition: transform var(--d-tab) var(--spring); }
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"] svg { transform: translateY(-1px) scale(1.06); }
.tab-ind { position: absolute; top: 8px; height: calc(100% - 16px); width: 60px; left: 0; border-radius: 16px; background: var(--brand-soft); transition: transform var(--d-tab) var(--ease); pointer-events: none; }
.addbtn { justify-self: center; width: 58px; height: 58px; border-radius: 20px; border: none; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(17, 99, 79, .4); transform: translateY(-14px); transition: transform var(--d-btn) var(--ease); }
.addbtn svg { width: 28px; height: 28px; }
.addbtn:active { transform: translateY(-14px) scale(.92); }

/* ---------- pull to refresh ---------- */
.ptr { position: absolute; left: 50%; top: 0; z-index: 4; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: var(--card); box-shadow: var(--sh-2); display: grid; place-items: center; transform: translateY(-48px); opacity: 0; pointer-events: none; }
.ptr svg { width: 20px; height: 20px; color: var(--muted); }
.ptr.ready { background: var(--brand-soft); }
.ptr.ready svg { color: var(--brand); }
.ptr.spin svg { color: var(--brand); animation: spin .8s linear infinite; }
.ptr.settle { transition: transform var(--d-card) var(--ease), opacity var(--d-card); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- cards & common blocks ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-1); }
.label { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; letter-spacing: .06em; margin: 0 0 8px; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
.icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .9rem; flex: none; }
.icon.sm { width: 26px; height: 26px; border-radius: 8px; font-size: .74rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .66rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; vertical-align: 2px; white-space: nowrap; }
.badge.view { background: var(--info-soft); color: var(--info); }
.badge.me { background: var(--brand-soft); color: var(--brand); }
.badge.lock { background: var(--danger-soft); color: var(--danger); }
.badge.src { background: var(--faint); color: var(--muted); }
.badge svg { width: 11px; height: 11px; }
.delta-up { color: var(--danger); font-weight: 700; }
.delta-down { color: var(--brand); font-weight: 700; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { min-height: 46px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: var(--r-md); padding: 10px 16px; font-weight: 600; flex: 1; min-width: 0; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .45; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: var(--fs-sm); flex: none; }
.text { width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); padding: 10px 14px; transition: border-color var(--d-btn), box-shadow var(--d-btn); }
.text:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.text.bad { border-color: var(--danger); animation: shake 300ms var(--ease); }
@keyframes shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.help { font-size: var(--fs-sm); color: var(--muted); margin: 0; }
.help ol, .help ul { margin: 6px 0 0; padding-left: 1.3em; }
.linklike { border: none; background: none; color: var(--brand); font-weight: 600; padding: 6px 0; }
.linklike.danger { color: var(--danger); }

/* chips (filters, choices) */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; padding: 2px 2px 4px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; transition: background-color var(--d-tab) var(--ease), color var(--d-tab), border-color var(--d-tab), transform var(--d-btn) var(--ease); }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .icon.sm { width: 20px; height: 20px; font-size: .62rem; border-radius: 6px; }
.chip.fav::before { content: "★"; color: var(--c4); font-size: .7rem; }
.chip.dashed { border-style: dashed; color: var(--brand); }

/* segmented control with sliding thumb */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--faint); border-radius: 12px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: none; background: none; min-height: 34px; border-radius: 9px; font-weight: 600; font-size: var(--fs-sm); color: var(--muted); transition: color var(--d-tab); }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 9px; background: var(--card); box-shadow: var(--sh-1); transition: transform var(--d-tab) var(--ease); }

/* switch */
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background-color var(--d-tab) var(--ease); }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform var(--d-tab) var(--spring); }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }

/* custom checkbox */
.cbx { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--muted); display: grid; place-items: center; margin: 0; transition: background-color var(--d-btn), border-color var(--d-btn); flex: none; }
.cbx::after { content: ""; width: 10px; height: 6px; border: 2.5px solid var(--on-brand); border-top: 0; border-right: 0; transform: rotate(-45deg) scale(0); transition: transform var(--d-tab) var(--spring); margin-top: -2px; }
.cbx:checked { background: var(--brand); border-color: var(--brand); }
.cbx:checked::after { transform: rotate(-45deg) scale(1); }
.cbx:disabled { opacity: .4; }

/* grouped list (iOS settings style) */
.group { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.group > * + * { border-top: 1px solid var(--line); }
.cell { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; width: 100%; background: none; border: none; text-align: left; }
.cell > .grow { flex: 1; min-width: 0; }
.cell strong { display: block; font-weight: 600; }
.cell small { display: block; color: var(--muted); font-size: var(--fs-xs); }
.cell .chev { color: var(--muted); }

/* accordion */
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d-card) var(--ease); }
.acc-body > div { overflow: hidden; }
.acc.open .acc-body { grid-template-rows: 1fr; }
.acc .acc-chev { transition: transform var(--d-tab) var(--ease); display: inline-block; }
.acc.open .acc-chev { transform: rotate(90deg); }

/* ---------- skeleton ---------- */
.sk { position: relative; overflow: hidden; background: var(--skel); border-radius: 8px; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--skel-hi), transparent); animation: shimmer 1.4s var(--ease) infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.sk.line { height: 12px; }
.sk.circle { border-radius: 50%; }
.loading-delay { animation: appear 1ms 160ms both; } /* skeletons only show if loading lasts >160ms, so fast loads don't flash */
@keyframes appear { from { visibility: hidden; } to { visibility: visible; } }
.fade-in { animation: fadein var(--d-card) var(--ease); }
@keyframes fadein { from { opacity: 0; } }

/* ---------- home: wallet cards ---------- */
.wallet { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 4px max(16px, env(safe-area-inset-left, 0px)) 10px; scroll-padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.wallet::-webkit-scrollbar { display: none; }
.pcard {
  flex: 0 0 calc(100% - 28px); scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden;
  min-height: 196px; border-radius: 24px; padding: 18px 18px 16px; color: #fff; background: var(--pc, #11634F);
  display: flex; flex-direction: column; gap: 6px; border: none; text-align: left;
  box-shadow: 0 10px 26px rgba(24, 40, 36, .22), inset 0 1px 0 rgba(255, 255, 255, .18);
  transition: transform var(--d-card) var(--ease), opacity var(--d-card) var(--ease);
}
.pcard::before { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .07); }
.pcard::after { content: ""; position: absolute; right: 30px; bottom: -110px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255, 255, 255, .05); }
.pcard.dim { transform: scale(.95); opacity: .7; }
.pcard > * { position: relative; z-index: 1; }
.pcard .top { display: flex; align-items: center; gap: 10px; }
.pcard .av { background: rgba(255, 255, 255, .22); width: 36px; height: 36px; }
.pcard .nm { font-weight: 700; font-size: var(--fs-md); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .pill { font-size: .66rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .2); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.pcard .pill svg { width: 11px; height: 11px; }
.pcard .lbl { font-size: var(--fs-xs); opacity: .82; margin-top: 8px; }
.pcard .big { font-size: var(--fs-hero); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.pcard .big small { font-size: 1.2rem; opacity: .8; margin-right: 2px; font-weight: 600; }
.pcard .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: var(--fs-xs); margin-top: auto; padding-top: 8px; }
.pcard .meta span { display: inline-flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, .15); padding: 4px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.pcard .meta svg { width: 13px; height: 13px; flex: none; }
.pcard.sk-card { background: var(--skel); box-shadow: none; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width var(--d-tab) var(--ease), background-color var(--d-tab); }
.dots i.on { width: 18px; background: var(--brand); }
.bar { height: 10px; border-radius: 6px; background: var(--faint); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--brand); width: 0; transition: width var(--d-chart) var(--ease), background-color var(--d-tab); }
.bar.over > i { background: var(--danger); }
.bar.near > i { background: var(--warn); }

/* ---------- entry rows ---------- */
.day { content-visibility: auto; contain-intrinsic-size: auto 220px; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 4px 6px; font-size: var(--fs-sm); font-weight: 700; }
.day-h span:last-child { color: var(--muted); font-weight: 600; }
.rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }

/* ---------- analysis ---------- */

/* ---------- entry sheet ---------- */

@media (max-height: 600px) { .keypad { grid-template-rows: repeat(4, 36px); gap: 4px; } .favrow { display: none; } .entry.stack { gap: 6px !important; } .entry .amount .v { font-size: 1.7rem; } .entry .amount { min-height: 34px; } .cat { padding: 2px 0; } .cat .icon { width: 26px; height: 26px; font-size: .74rem; border-radius: 8px; } .entry .subs .chip { min-height: 28px; } .mchip { min-height: 36px; } .tworow .text { min-height: 38px; padding: 6px 10px; } }

/* autocomplete */
.ac { position: relative; }
.ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-2); max-height: 232px; overflow-y: auto; animation: ac-in 160ms var(--ease); transform-origin: top; }

.rcpt { display: flex; gap: 14px; align-items: center; }

.imp { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 0; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }

@keyframes toast-in { from { opacity: 0; transform: translateY(16px) scale(.98); } }

.toast .ti { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }

/* ---------- drawer ---------- */

.full { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
